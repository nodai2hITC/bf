<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1, maximum-scale=1" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/codemirror.min.css" integrity="sha512-uf06llspW44/LZpHzHT6qBOIVODjWtv4MxCricRxkzvopAlSWnTf6hpZTFxuuZcuNE9CBQhqE0Seu1CoRk84nQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="stylesheet" href="style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/autosize.js/3.0.20/autosize.min.js" integrity="sha512-EAEoidLzhKrfVg7qX8xZFEAebhmBMsXrIcI0h7VPx2CyAyFHuDvOAUs9CEATB2Ou2/kuWEDtluEVrQcjXBy9yw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/codemirror.min.js" integrity="sha512-8RnEqURPUc5aqFEN04aQEiPlSAdE0jlFS/9iGgUyNtwFnSKCXhmB6ZTNl7LnDtDWKabJIASzXrzD0K+LYexU9g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/addon/edit/matchbrackets.min.js" integrity="sha512-GSYCbN/le5gNmfAWVEjg1tKnOH7ilK6xCLgA7c48IReoIR2g2vldxTM6kZlN6o3VtWIe6fHu/qhwxIt11J8EBA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/brainfuck/brainfuck.min.js" integrity="sha512-Ky9je8bl91bW2Sz4pCx7VuKssFnQhYJCQnMBViVMY0HyXlTjblcVlWrP/yef8ncUhMXh954VHg+V/TxpTvKKTQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="bf.js"></script>
<script defer src="script.js"></script>
<title>BF Interpreter</title>
</head>
<body>

<h1>BF Interpreter</h1>

<textarea id="editor" spellcheck="false"></textarea>

<button id="run" type="button">▶実行</button>
<button id="copy" type="button">URL でコピー</button>

<details>
  <summary>詳細設定</summary>
  <span class="nowrap"><label for="speed">実行速度：</label>
  <select name="speed" id="speed">
    <option value="0">高速</option>
    <option value="1">1 ms</option>
    <option value="5">5 ms</option>
    <option value="10">10 ms</option>
    <option value="20" selected>20 ms</option>
    <option value="50">50 ms</option>
    <option value="100">100 ms</option>
  </select>　</span>
  <span class="nowrap"><label for="cell_bit">セルのビット数：</label>
  <select name="cell_bit" id="cell_bit">
    <option value="8" selected>8 bit</option>
    <option value="32">32 bit</option>
  </select>　</span>
  <span class="nowrap"><label for="eof">EOF の値：</label>
  <select name="eof" id="eof">
    <option value="0">0</option>
    <option value="-1" selected>-1</option>
  </select></span>
  <p>入力：</p>
  <textarea id="input"></textarea>
</details>

<p>出力：</p>
<textarea id="output" readonly></textarea>

<p>記憶領域：</p>
<table>
  <tr id="ptrs"></tr>
  <tr id="cells"></tr>
  <tr id="chars"></tr>
</table>


<p>コード：</p>
<pre id="code"><span id="before"></span><span id="active"></span><span id="after"></span></pre>

</body>
</html>
